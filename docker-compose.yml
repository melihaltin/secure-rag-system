version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hr-guard-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash-lite-preview-09-2025}
      - TEMPERATURE=${TEMPERATURE:-0.3}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./chroma_db:/app/chroma_db
    networks:
      - hr-guard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hr-guard-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://159.65.124.119:8000
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hr-guard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  hr-guard-network:
    driver: bridge

volumes:
  logs:
  sessions:
  chroma_db:
